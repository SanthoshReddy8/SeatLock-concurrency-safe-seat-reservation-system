name: seatlock-tests
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
      POSTGRES_DB: booking_test
    ports:
      - "127.0.0.1:15433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking -d booking_test"]
      interval: 2s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:16380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
  load-api:
    profiles: ["load"]
    build: .
    command: ["sh", "-c", "node dist/scripts/migrate.js && node dist/src/server.js"]
    environment:
      PORT: 3001
      DATABASE_URL: postgres://booking:booking@postgres:5432/booking_test
      REDIS_URL: redis://redis:6379
      RATE_LIMIT_MAX: 100000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 20
  k6:
    profiles: ["load"]
    image: grafana/k6:1.0.0
    volumes:
      - ./load:/scripts:ro
    command: ["run", "/scripts/k6.js"]
    environment:
      BASE_URL: http://load-api:3001
      CONFIRM_BOOKINGS: "1"
    depends_on:
      load-api:
        condition: service_healthy
